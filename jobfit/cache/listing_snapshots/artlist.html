reakdown of credit costs per generation.\",\"contentVoiceOver\":\"With the AI Suite and Max Pro plans, you can choose the number of monthly credits that best fits your project needs — from 7,500 to 120,000. The AI Voiceover plan includes 7,500 credits, which let you generate up to 1.5 hours of voiceovers. Credits automatically renew each month. On a Business plan? You can choose a custom credit amount to match your needs.\"},\"item8\":{\"title\":\"What if my team needs more than one seat?\",\"content1\":\"With\",\"content2\":\"or\",\"content3\":\"you get a Pro license and can add 2 to 7 seats. These plans are available for teams at companies with fewer than 50 employees globally.\\n\\nNeed more seats or wider usage? The Business plan includes a Business license and lets you add unlimited team members. It's ideal for companies with 50+ employees, agencies, broadcasters, and teams with specific licensing needs. You'll also get access to music stems, exclusive pre-release content, and more.\",\"link1\":\"Artlist Max Teams\",\"link2\":\"Music \u0026 SFX Teams\",\"link3\":\"Talk to a Business expert\",\"content4\":\"to get a custom plan tailored to your team.\"}},\"payment\":{\"item1\":{\"title\":\"Can I try Artlist for free?\",\"content\":\"Yes! With a free account, you can download watermarked songs and footage to test in your videos, and try out our AI tools. To download non-watermarked assets or generate more AI images, videos and voiceovers, you'll need a paid subscription.\",\"contentWithMusic\":\"Yes! With a free account, you can download watermarked songs and footage to test in your videos, and try out our AI tools. To download non-watermarked assets or generate more AI images, videos, voiceovers, and music, you'll need a paid subscription.\",\"contentVoiceOver\":\"Yes! With a free account, you can download watermarked songs and footage to test in your videos, and try out our AI tools. To download non-watermarked assets or generate more AI images, videos and voic ed, it will automatically appear on Artlist.\",\"contentWithMusic\":\"You’ll always get the best AI image, video, voiceover, and music generators available. When a model update is released, it will automatically appear on Artlist.\"},\"item4\":{\"title\":\"What is the difference between the AI plans?\",\"content1\":\"With all AI plans, you can choose the number of monthly credits that best fits your project needs.\",\"content1WithMusic\":\"With all AI plans, you can choose the number of monthly credits that best fits your project needs.\",\"bullet1\":\"AI Starter: Starts at 7,500 credits per month, which only includes AI voiceover generation. From 16,500 credits per month, you get AI voiceover, video, image, music generation, and Artlist Studio access.\",\"bullet2\":\"AI Creator, AI Professional and AI Pro Plus: Includes access to the full AI Toolkit (video, image, voiceover, and music generation), plus Artlist Studio for advanced end-to-end production. You can choose between 80,000 to 4,000,000 credits per month. Includes unlimited generations on certain models.\",\"bullet3\":\"Max: Includes everything Artlist has to offer — stock assets and AI tools. You can choose between 7,500 to 120,000 credits per month. Includes unlimited generations on certain models.\",\"bullet4\":\"Max Business: Built for businesses with 50+ employees and agencies of any size that want a ready-to-use solution with access to all of the AI products, stock, and a commercial license.\",\"bullet5\":\"Artlist Enterprise: Made for global teams that need a customized solution with AI products, stock, scalable features, a tailored enterprise license, and advanced security and control.\",\"link\":\"Talk\",\"linkUrl\":\"https://artlist.io/enterprise/contact-sales\",\"linkSuffix\":\" to an Enterprise expert to get a custom plan tailored to your needs.\"},\"item5\":{\"title\":\"How do I know which plan is right for me?\",\"content1\":\"Start by choosing what you need: AI tools, stock assets, or both.\",\"content1WithMusic\":\"Start by choosing what you need: AI tools, stock assets, or both.\",\"content2\":\"If you're looking to create with Artlist's cutting-edge generative AI tools, like video, image, music, voiceover, and end-to-end AI production, pick one of the AI plans. If you're a pro user, go for AI Professional or AI Pro Plus so that you can get Unlimited generations on select leading models, without worrying about credits.\",\"content3\":\"Looking to create with music, sound effects, footage, templates, LUTs, and plugins? The \",\"link1\":\"Music \u0026 SFX\",\"link2\":\"Max\",\"content3b\":\" plans have what you want. Only need sound effects? Go with the \",\"link5\":\"Sound Effects Pro\",\"content5\":\" plan. Only need footage and templates? Go with the \",\"link6\":\"Footage \u0026 Templates\",\"content6\":\" plan.\",\"content7\":\"Want it all? The Max and Max Teams plans give you access to Artlist's full stock catalog and AI image, video, music, voiceover generation, and Artlist Studio.\",\"content7WithMusic\":\"Want it all? The Max and Max Teams plans give you access to Artlist's full stock catalog and AI image, video, music, voiceover generation, and Artlist Studio.\",\"content8\":\"If you're part of a 50+ employee business or an agency of any size that needs production-ready AI tools, stock, and a commercial license, Max Business is designed for you.\",\"content9\":\"For global teams operating at enterprise scale, Artlist Enterprise delivers a custom solution with a tailored license, AI tools, stock, a dedicated account manager, advanced security and oversight, and scalable features designed to support growth.\",\"enterpriseLink\":\"Talk\",\"enterpriseLinkSuffix\":\" to an Enterprise expert to get a custom plan tailored to your needs.\"},\"item6\":{\"title\":\"What are the benefits of an annual plan?\",\"content\":\"An annual plan gives you more for less. Get all the newest models automatically added to your plan. You’ll also save money and get more credits to ensure you have everything you need to create, all year long.\"},\"item7\":{\"title\":\"How does Unlimited work?\",\"content1\":\"Unlimited lets you generate content on select leading models without using your credits. It’s designed to help you stay in your creative flow and iterate freely.\",\"bullet1\":\"Generation speed: You get a set number of fast generations each month. Once those are used, you still have unlimited access — generations simply process at a standard speed.\",\"bullet2\":\"Using credits: If you need a speed boost, you can toggle off Unlimited to use your credits for fast processing.\",\"bullet3\":\"Parallel generations: When using Unlimited, your plan includes a limit on how many assets you can generate at the same time.\",\"bullet4\":\"Models and settings: Unlimited is available for certain models and settings. To use others, simply switch back to using your credits.\",\"bullet5\":\"Fair use: Unlimited is for human use only. To keep the platform fast for everyone, we don't permit automation, scraping or account sharing.\"},\"item8\":{\"title\":\"What are fast generations?\",\"content\":\"With Unlimited, you get a set number of fast, top-priority generations each month. Once these are used, you can still create with Unlimited — generations simply process at a standard speed. Your monthly amount depends on your plan (for example, 4,000 fast generations with AI Professional).\"},\"item9\":{\"title\":\"What are parallel generations?\",\"content\":\"Parallel generations are the number of assets you can create at the same time. For example, if your plan includes 10 parallel generations, you can have 10 different assets generating simultaneously (e.g. 3 videos and 7 images). To speed up your workflow and create even more assets at once, you can upgrade your plan at any time.\"},\"item10\":{\"title\":\"Does Artlist offer stock music and footage plans?\",\"content1\":\"Yes. If you're looking for stock music, SFX, or footage, our Stock Catalog plans have you covered. See stock plans and pricing \",\"link\":\"here\",\"content2\":\".\"}},\"stockCatalogFaq\":{\"item1\":{\"title\":\"Can I monetize my videos with Artlist's license?\",\"content\":\"Yes! You can monetize your videos with any paid plan.\"},\"item2\":{\"title\":\"What's the difference between the social license, Pro license, Business license, and Enterprise license?\",\"content1\":\"The Social license lets you clear and monetize one personal channel per social platform. The Pro license covers up to three channels on any platform and supports all video types — including commercial use, client work and global distribution.\",\"content2\":\"The Business license is for agencies, broadcasters, and companies with 50+ employees. It can extend coverage and usage rights across your entire organization, supports unlimited distribution and a wider variety of projects, and can be customized to fit your business needs.\",\"content3\":\"The Enterprise license is a custom solution, tailored for organizations with global operations or advanced licensing needs.\",\"content4\":\"To learn more about our Enterprise license, get in touch with our sales team \",\"link\":\"here\",\"linkUrl\":\"https://artlist.io/enterprise/contact-sales\",\"linkSuffix\":\".\"},\"item3\":{\"title\":\"How long is my license valid for?\",\"content1\":\"All projects you create and publish while your subscription is active are covered forever. \",\"link\":\"Learn about Artlist licenses\"},\"item4\":{\"title\":\"Does the license cover commercial projects?\",\"content\":\"Yes — if you're subscribed to one of these plans: Music \u0026 SFX Pro, Footage \u0026 Templates, Artlist Max, or Business.\"},\"item5\":{\"title\":\"What if my business or client requires a custom license?\",\"content\":\"No problem! We can create a custom plan to match your unique needs.\",\"contentSuffix\":\"To learn more, talk to our sales team \",\"link\":\"here\",\"linkUrl\":\"https://artlist.io/enterprise/contact-sales\",\"linkSuffix\":\".\"},\"item6\":{\"title\":\"How do I know which plan is right for me?\",\"content1\":\"Start by choosing what you need to create: AI tools, the stock catalog, or both. Looking to create with music, sound effects, footage, templates, LUTs, and plugins? \",\"link1\":\"The Music \u0026 SFX\",\"link2\":\"Artlist Max\",\"link3\":\"Artlist Max Teams\",\"content2\":\", or \",\"link4\":\"Music \u0026 SFX Teams\",\"content3\":\" plans have what you want. Only need sound effects? Go with the \",\"link5\":\"Sound Effects Pro\",\"content4\":\" plan. Only need footage and templates? Go with the \",\"link6\":\"Footage \u0026 Templates\",\"content5\":\" plan.\",\"content6\":\"If you're looking to create with Artlist's cutting-edge generative AI tools, like video, image, music, voiceover, and end-to-end AI production, our \",\"content6WithMusic\":\"If you're looking to create with Artlist's cutting-edge generative AI tools, like video, music, image, voiceover, and end-to-end AI production, our \",\"link7\":\"AI Suite\",\"content7\":\" is perfect for you. Pick between the AI Starter, AI Creator, AI Professional and AI Pro Plus plans.\",\"content10\":\"Want it all? The Artlist Max and Artlist Max Teams plans give you access to Artlist's full stock catalog and AI image, video, music, voiceover, and Artlist Studio.\",\"content10WithMusic\":\"Want it all? The Artlist Max and Artlist Max Teams plans give you access to Artlist's full stock catalog and AI image, video, music, and Artlist Studio.\",\"content11\":\"If you're part of a business with 50+ employees or an agency of any size looking for production-ready AI tools, stock and a commercial license, Artlist Max Business is built for your needs.\",\"content12\":\"For global teams operating at enterprise scale, Artlist Enterprise delivers a custom solution. It includes a tailored license, AI tools, stock, a dedicated account manager, advanced security and oversight and scalable features designed to support growth.\",\"content13\":\"To learn more about our Enterprise plan, get in touch with our sales team \",\"enterpriseLink\":\"here\",\"enterpriseLinkSuffix\":\".\"},\"item7\":{\"title\":\"What if my team needs more than one seat?\",\"content1\":\"With Artlist Max Teams or Music \u0026 SFX Teams, you get a Pro license and can add 2 to 7 seats. These plans are available for teams at companies with fewer than 50 employees globally.\",\"content2\":\"Need more seats or broader rights? Max Business lets you add up to 7 team members. It's designed for companies with 50+ employees and agencies of any size.\",\"content3\":\"For global teams operating at enterprise scale, Artlist Enterprise lets you add a custom number of seats.\",\"link\":\"Talk\",\"linkUrl\":\"https://artlist.io/enterprise/contact-sales\",\"linkSuffix\":\" to an Enterprise expert to get a custom plan tailored to your team.\"},\"item8\":{\"title\":\"Can I try Artlist for free?\",\"content\":\"Yes! With a free account, you can download watermarked songs and footage to test in your videos, and try out our AI tools. To download non-watermarked assets or generate more AI images, videos and voiceovers, you'll need a paid subscription.\",\"contentWithMusic\":\"Yes! With a free account, you can download watermarked songs and footage to test in your videos, and try out our AI tools. To download non-watermarked assets or generate more AI images, videos, voiceovers, and music, you'll need a paid subscription.\"},\"item9\":{\"title\":\"How can I pay for my subscription?\",\"content\":\"You can pay using Google Pay, Apple Pay, PayPal, or a credit card — right on our site. Once payment is complete, you can immediately start downloading and using assets. Need a receipt? Your invoice is available in \\\"My Account\\\".\"},\"item10\":{\"title\":\"Can I pay monthly?\",\"content\":\"Yes! Monthly billing is available — and you can cancel anytime — with these plans: Music \u0026 SFX Social, AI Voiceover, AI Starter, and AI Professional.\"},\"item11\":{\"title\":\"How does Unlimited work?\",\"content1\":\"Unlimited lets you generate content on select leading models without using your credits. It’s designed to help you stay in your creative flow and iterate freely.\",\"bullet1\":\"Generation speed: You get a set number of fast generations each month. Once those are used, you still have unlimited access — generations simply process at a standard speed.\",\"bullet2\":\"Using credits: If you need a speed boost, you can toggle off Unlimited to use your credits for fast processing.\",\"bullet3\":\"Parallel generations: When using Unlimited, your plan includes a limit on how many assets you can generate at the same time.\",\"bullet4\":\"Models and settings: Unlimited is available for certain models and settings. To use others, simply switch back to using your credits.\",\"bullet5\":\"Fair use: Unlimited is for human use only. To keep the platform fast for everyone, we don't permit automation, scraping or account sharing.\"},\"item12\":{\"title\":\"What are fast generations?\",\"content\":\"With Unlimited, you get a set number of fast, top-priority generations each month. Once these are used, you can still create with Unlimited — generations simply process at a standard speed. Your monthly amount depends on your plan (for example, 4,000 fast generations with AI Professional).\"},\"item13\":{\"title\":\"What are parallel generations?\",\"content\":\"Parallel generations are the number of assets you can create at the same time. For example, if your plan includes 10 parallel generations, you can have 10 different assets generating simultaneously (e.g. 3 videos and 7 images). To speed up your workflow and create even more assets at once, you can upgrade your plan at any time.\"}},\"studioLaunchDisclaimer\":\"Studio launch credits are valid for 30 days from the date of purchase and can be used in Studio only.\",\"soc2Faq\":{\"title\":\"Is Artlist SOC 2 Type II certified?\",\"content\":\"Yes. Artlist is SOC 2 Typ
