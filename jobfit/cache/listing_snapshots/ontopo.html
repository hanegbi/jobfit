tess on a smart platform that allows for maximum income from the management of the stay at any given time.\",\"title\":\"Ease of use + maximizing recovery\"},\"digital\":{\"text1\":\"Provides you with all the digital needs required to book a place in your business.\",\"text2\":\"The campaigns in Ontopo vary from general campaigns for certain areas to targeted campaigns for certain audiences or certain days and hours. The system knows how much money was invested and exactly how much was returned.\",\"title2\":\"Order pages + data access!\",\"title\":\"Strengthening and expanding digital assets\"},\"promotion\":{\"text1\":\"Ontopo takes its place as the Google of the culinary world. The perfect platform to promote and market a business in the culinary field thanks to a very targeted audience - booking a place.\",\"text2\":\"The campaigns in Ontopo vary from general campaigns for certain areas to targeted campaigns for certain audiences or certain days and hours. The system knows how much money was invested and exactly how much was returned.\",\"title\":\"Increasing the number of customers - internal promotion!\"}},\"content\":{\"title\":\"Ontopo is happy to expand and invites you to join the family\",\"text\":\"Using Ontopo will allow you to manage guests and orders in a simple and easy way, thus collecting essential information that allows the business to market and advertise in a smart and accurate way, at cheaper costs and with higher success rates.\"},\"data\":{\"visit\":\"Site visits per day\",\"restaurants\":\"Restaurants nationwide\",\"orders\":\"Orders every day through Ontopo\",\"clients\":\"uniques\",\"visitData\":\"100K\",\"restaurantsData\":\"1000+\",\"ordersData\":\"3000+\",\"clientsData\":\"1.5M\"},\"contact\":{\"title\":\"Contact\",\"text\":\"Want to hear more about Ontopo? \\nLeave details and we will get back to you right away! \",\"name\":\"Name\",\"phone\":\"Phone\",\"email\":\"Email\",\"business\":\"Business name\",\"cta\":\"Send\",\"contactPhone\" R\",\"title\":\"For Every Type of Culinary Hospitality Business\",\"description\":\"Whether you're managing a cozy café or a high-volume restaurant, Ontôpo adapts to your unique needs and helps you run smoother, smarter operations.\",\"callToAction\":\"Join Ontôpo\",\"altImage\":\"Venue grid showing restaurant interiors and food\"},\"platformOverview\":{\"subtitle\":\"overview\",\"title\":\"One Smart Platform for All Your Reservations\",\"description\":\"Tired of juggling multiple reservation channels? Ontopo consolidates all bookings - phone reservations, digital requests, and walk-ins - into one seamless system, making it easier than ever to manage your restaurant’s occupancy.\"},\"features\":{\"noShow\":{\"title\":\"No Show Feature\",\"description\":\"No Show Feature\"},\"feature1\":{\"title\":\"Fill Every Table, Maximize Your Profits\",\"description\":\"Your team now has a powerful digital assistant. Ontopo’s advanced algorithm optimizes seating in real time, ensuring maximum table occupancy and eliminating empty seats. The system prioritizes and arranges seating automatically, keeping service smooth and efficient.\"},\"feature2\":{\"title\":\"Reducing No-Show and Cancellation Rates\",\"description\":\"Reducing no-shows and last-minute cancellations = higher profitability for your business. Through the use of automatic smart alerts, payment security, overbooking management, and reliability ratings, Ontopo makes sure you know exactly who’s coming – and when.\"},\"feature3\":{\"title\":\"Your Personal Account Manager – Guiding You to Success\",\"description\":\"At Ontopo, every business is assigned a dedicated account manager who guides you through every step. From optimizing your reservation flow to analyzing guest trends, they help you gain valuable insights and maximize performance, ensuring you get the most out of the platform.\"},\"feature4\":{\"title\":\"Turn Guest Data Into Business Growth\",\"description\":\"Ontopo helps you track and analyze valuable guest data to improve your business performance. Identify frequent visitors, understand peak times, monitor revenue trends, and collect feedback to enhance customer experience and increase loyalty over time.\"},\"feature5\":{\"title\":\"Seamless POS Integration\",\"description\":\"Our integration to the leading POS systems allows you, at any given moment, to see at what order stage each table is. You can also see what the customer ordered and the amount they paid on their customer personal card, and even analyze the revenue each of your advertising and campaigns have generated.\"}},\"testimonials\":{\"header\":\"REAL STORIES FROM REAL VENUES\",\"title\":\"What Our Customers Say\",\"description\":\"From smoother operations to packed weekends — see how Ontôpo helps teams do more with less hassle.\",\"logoAlt\":\"Company logo\",\"il\":{\"customer1\":{\"name\":\"Maja Živanović\",\"position\":\"Manager @Kafeterija\",\"quote\":\"Ontôpo has transformed our reservation system. We can now manage our tables effortlessly, and the automated features have significantly reduced no-shows.\"},\"customer2\":{\"name\":\"Owner\",\"position\":\"Grand Cafe Van Gogh\",\"quote\":\"Ontopo transformed our manual, time-consuming process into a fully automated one. Their team guided us through every step and tailored the platform to our needs.\"},\"customer3\":{\"name\":\"Shaul Feldinger, Owner\",\"position\":\"5ensi Brasserie\",\"quote\":\"Switching from pen and paper to Ontopo was a game changer. The smart seating algorithm fills every gap and maximizes occupancy – without compromising the guest experience. For the first time, it doesn’t feel like everything depends on our hostess. The system just knows what to do.\"},\"customer4\":{\"name\":\"Marko Kostić\",\"position\":\"Waiter @Kaldi\",\"quote\":\"Whenever we have a question or issue, our dedicated account manager is always available. It feels like they're part of our team.\"},\"customer5\":{\"name\":\"Ivan Petrović\",\"position\":\"Operatio ation management so much easier. It allows our team to focus more on what truly matters – improving the guest experience and the quality we offer.\"}}},\"intro_text\":{\"title\":\"ONTÔPO IN NUMBERS\",\"headline\":\"Trusted by Thousands of Hospitality Teams Worldwide\",\"description\":\"Real results from real venues using Ontôpo every day.\"},\"ontopo_stats\":{\"stats1\":{\"value\":\"+2,500\",\"label\":\"BUSINESS PARTNERS WORLDWIDE\"},\"stats2\":{\"value\":\"2.6m\",\"label\":\"DINERS EVERY MONTH\"},\"stats3\":{\"value\":\"2m\",\"label\":\"WEBSITE AND APP USERS\"},\"stats4\":{\"value\":\"700k\",\"label\":\"MONTHLY ONLINE RESERVATIONS\"},\"stats5\":{\"value\":\"22%\",\"label\":\"HIGHER REVENUE FROM ONLINE VS. WALK-INS\"},\"stats6\":{\"value\":\"94.8%\",\"label\":\"SATISFACTION RATE FROM CUSTOMER SUPPORT\"}},\"pricing\":{\"title\":\"Our Plans\",\"headline\":\"Choose Your Plan & Start Growing Today\",\"description\":\"From essentials to full service control — pick the plan that matches your needs.\",\"plans\":{\"basic\":{\"name\":\"Basic Plan\",\"price\":\"100€\",\"pricePeriod\":\"month\",\"description\":\"Ideal for small venues – covers all essential tools to run your business smoothly.\",\"features\":{\"feature1\":\"Improving marketing\",\"feature2\":\"Digital reservations list\",\"feature3\":\"Online business profile for reservations\",\"feature4\":\"Featured listing on the Ontôpo website & app\",\"feature5\":\"Mobile\u002Ftablet hospitality app\",\"feature6\":\"Digital waitlist management\",\"feature7\":\"Guest data tracking and insights\"},\"cta\":\"Get started\"},\"go\":{\"name\":\"Go Plan\",\"price\":\"150€\",\"pricePeriod\":\"month\",\"tag\":\"Popular\",\"description\":\"Built for busy venues – full access to advanced tools and real-time service management.\",\"features\":{\"feature1\":\"Real-time order management during service, increased marketing, managing everything in one place\",\"feature2\":\"Online business profile for reservations\",\"feature3\":\"Featur lts\":{\"tags\":\"Tags\",\"filter\":\"Area\",\"sections\":\"Category\",\"clearAll\":\"Clear filters\",\"filtersText\":\"Filters\",\"filterText\":\"Show %count% results\",\"refreshResults\":\"The results are outdated, click for new results\",\"noAvailableSeat\":\"Sorry, there are no available seats at the requested time\",\"bookingCount\":\"Booked %count%  times today\",\"results\":\"Results\",\"searchMatches\":\"Best matches\",\"showAllVenues\":\"Show all venues\",\"popularSearches\":\"Popular searches\",\"recentSearches\":\"Recently searched\",\"clearRecent\":\"Clear all\",\"searchLocation\":\"Search location\",\"currentLocation\":\"Use current location\",\"allResults\":\"All results\",\"suggestedText\":\"Discover similar places\",\"sectionAreas\":\"Areas\",\"sectionStreets\":\"Streets\",\"sectionCities\":\"Cities\",\"sectionVenues\":\"Restaurants\"},\"shifts\":{\"person\":\"1 person\",\"persons\":\"people\",\"header\":\"Booking for %venue.name%\",\"action\":\"Find\",\"ignoreDay\":\"Day\",\"today\":\"Today\",\"select\":\"Select\",\"gap\":\"No reservations from %1% until %2%\",\"calendar\":\"More dates\",\"opening\":\"Booking for today is not avaliable\"},\"availabilities\":{\"phone\":\"Phone\",\"walkin\":\"Walk-in\",\"standby\":\"Standby\",\"special\":\"Special offers\",\"callback\":\"Callback\",\"link\":\"Link\"},\"giftcards\":{\"title\":\"Come and enjoy Ontopo giftcard\",\"description\":\"Want to pamper yourself with a cool gift? Do you want to purchase a gift card for the variety of restaurants of Ontopo?\",\"button\":\"To purchase a gift card\",\"venues\":\"Participating restaurants\",\"venuesSubtitle\":\"The gift can be enjoyed at a wide selection of leading restaurants and places across Israel\",\"giftcard\":\"Ontopo gift card\",\"rest\":\"restaurants\",\"listTitle\":\"Gift card for an experience at a selected restaurant\",\"viewAll\":\"View the full places\",\"marketplaceTitle\":\"Ontopo Giftcard, the tastiest gift to give\",\"marketplaceSubtitle\":\"Accepted at Israel’s leading restaurants\",\"headerTitle\":\"Ontopo Giftcard\",\"headerSubtitle\":\"The perfect gift for food lovers: unforgettable experiences at dozens of Israel’s leading restaurants and bars, whenever and wherever they choose.\",\"headerButton\":\"Buy gift card\",\"headerVenues\":\"\",\"amountText\":\"\",\"amount\":\"100\",\"questions\":{\"title\":\"Questions and answers\",\"items\":[{\"question\":\"How does the recipient redeem the gift card at the restaurant?\",\"answer\":\"Redeeming the gift card is quick and easy, just like paying by credit card. At the end of the meal, enter the amount you wish to pay and show the gift card number to your server. The remaining balance will be updated automatically.\"},{\"question\":\"Do I have to use the full amount in one visit?\",\"answer\":\"Not at all. The gift card offers complete flexibility—you can use it to pay part of the bill or split the balance across multiple visits until it has been fully redeemed.\"},{\"question\":\"Where can the gift card be redeemed?\",\"answer\":\"The gift card is accepted at dozens of restaurants and bars listed on this page, which can be filtered by area and cuisine. Please note that the list of participating venues is subject to change and is updated periodically, so we recommend checking it before visiting the restaurant.\"},{\"question\":\"Can I use the gift card to leave a tip? What about special offers?\",\"answer\":\"The gift card can be used to pay for the meal itself but cannot be used for tips or delivery fees. It can generally be combined with promotions available to all customers, but not with exclusive loyalty club discounts unless approved by the restaurant.\"},{\"question\":\"How long is the gift card valid?\",\"answer\":\"The gift card is valid for five years from the date of purchase, in accordance with applicable law. You can check its expiration date and current balance at any time through your personal account on our website or app.\"},{\"question\":\"When will I receive a tax invoice for my purchase?\",\"answer\":\"According to the Israel Tax Authority’s guidelines, purchasing a gift card is considered an exchange of payment methods. Therefore, a tax invoice is issued by the restaurant only when the gift card is redeemed, after the meal. A receipt will be sent to you when you purchase the gift card.\"}]},\"howItWorks\":{\"title\":\"Why is it the perfect gift?\",\"payTitle\":\"Quick and easy payment\",\"payDesc\":\"Pay easily at the restaurant, just like with a credit card - no codes and no waiting for a manager.\",\"visitsTitle\":\"Flexible Redemption\",\"visitsDesc\":\"There’s no need to use the full amount in one visit. Enjoy the experience and save the remaining balance for next time.\",\"locationsTitle\":\"Freedom of Choice\",\"locationsDesc\":\"The gift card is accepted at dozens of Israel’s most sought-after restaurants, bars, and entertainment venues.\"},\"search\":{\"title\":\"Browse participating venues\",\"subtitle\":\"Search by name, or filter by area and cuisine.\",\"placeholder\":\"Search by venue name\",\"area\":\"Area\",\"cuisine\":\"Cuisine\",\"button\":\"Search\",\"showMoreVenues\":\"Show more venues\",\"clearFilters\":\"Clear filters\"},\"countVenues\":\"Works at %count% places\"}}},\"front\":{\"error\":{\"save\":\"error in save data\",\"invalidPhone\":\"Invalid Phone\",\"invalidCode\":\"Invalid Code\"},\"errorMessage\":{\"general\":{\"networkOfflineTitle\":\"Network problems\",\"networkOffline\":\"You’re offline, Please check your internet connection\",\"networkOfflineLogin\":\"Can't log in, check network connection\",\"loadI18nRetry\":\"Failed to load translations, retry attempt: { retry }\",\"loadI18nFailed\":\"Failed to load translations\",\"saveFailed\":\"error in save data: {errors}\",\"saveSucceeded\":\"The data has been saved\",\"copyClipboardSucceeded\":\"The data has been copied to clipboard\",\"loadSummaryX\":\"Load SummaryX failed: {errors}\",\"upsertPatron\":\"Upsert patron failed: {errors
