    <style type="text/css">
      /* ---------------- A.Sy - Custom CSS ---------------- */
body {
  position: relative;
}

@font-face {
  unicode-range: U+0020-007E, U+0100-017F; /* Basic + Extended Latin */
}

#teconsent {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
/* 
  Global Styles
*/


:root {
  --white: #fff;
  --text-colour: #3d3935;
  --nav-hover-colour: #3d3935;
}


/* 
Type 
*/


/* Font: Headings */
.pinpoint-block--hero .careers-hero-block__title,
.external-panel .external-panel__title,
.pinpoint-block--text .careers-block__h2,
.pinpoint-block--cards .careers-card-block__h3,
.pinpoint-block--jobs .careers-block__h2,
.pinpoint-block--testimonial cite,
.careers-testimonial-block__attribution {
  font-weight: 600 !important;
}

.pinpoint-block--hero .careers-hero-block__title {
  font-size: 3.6rem;
  margin-top: 0;

  @media (min-width: 768px) {
    font-size: 9.6rem;
  }
}

#home-hero {
  .careers-hero-block__title {
    font-size: 6.3rem;
  
    @media (min-width: 768px) {
      font-size: 9.6rem;
    }
  }
}

.external-panel__title.external-panel__title--large {
  font-size: 3.4rem;
  color: #079ACE;
}

.pinpoint-block--text .careers-block__h2,
.pinpoint-block--jobs .careers-block__h2 {
  font-size: 3rem;
  line-height: 1.1;
}

.pinpoint-block--text .careers-block__h2 {
  margin-bottom: 30px;
}

.pinpoint-block--cards .careers-card-block__h3 {
  line-height: 1.1;
}

/* Font: Text */
body {
  font-weight: 500;
}

.careers-hero-block .careers-hero-block__text,
.pinpoint-block--cards .careers-card-block__p,
.pinpoint-block--text .careers-block__trix, 
.careers-testimonial-block__quotation,
#application-fieldset-details > legend .external-form__text,
.external-form .external-form__label span:not(.external-form__label--title),
.external-form .external-form__text,
.external-panel .external-panel__text,
.external-panel .external-panel__trix-content,
.external-definition-list dd,
.external-panel .external-panel__link {
  font-weight: 500 !important;
}

.pinpoint-block--cards .careers-card-block__p,
.pinpoint-block--text .careers-block__trix {
  font-size: 1.8rem;
  line-height: 1.6;
}


/* Font: Button */
.external-button {
  font-weight: 500 !important;
  line-height: 1.6;
}

/* 
Text Colours
*/

/* Colour: Hero */
.pinpoint-block--hero .careers-hero-block__title,
.careers-hero-block__text {}

/* Colour: Headings */
.careers-block__h2,
.external-panel .external-panel__title {}

/* Colour: Sub headings */
.pinpoint-block--cards .careers-card-block__h3,
.external-panel .external-panel__heading {
  
}

/* Colour: All Headings */
.careers-block__h2,
.pinpoint-block--text .careers-block__h2,
.external-panel .external-panel__title,
.external-panel .external-panel__heading,
.pinpoint-block--cards .careers-card-block__h3 {
  color: #3d3935;
}

/* Colour: Text */
.pinpoint-block--cards .careers-card-block__p,
.pinpoint-block--text .careers-block__trix,
.external-panel .external-panel__trix-content,
.external-definition-list dd,
.external-stage-carousel .external-stage-carousel__stage-name,
.external-panel .external-panel__text {
  color: var(--text-colour);
}


/* 
Navigation Menu 
*/

/* Hide the Logo Text */
.careers-navigation-block__logo-text,
.careers-hero-block__logo-text {
  display: none;
}

/* Nav style */
.pinpoint-block--navigation {

    > div {
    max-width: 1280px;
    margin: 0 auto;
  
    @media (min-width: 1280px) {
      padding: 0 30px;
    }
  }

  /* Nav items */
  .careers-navigation-block__menu-item {
    color: #ffffff !important;
    background-color: transparent !important;
    border: 1px solid #ffffff;
    border-radius: 30px;
    font-weight: 500 !important;
    padding: 8px 24px;
  }

  .careers-navigation-block__menu-item.careers-navigation-block__hoverzone {
    color: #000000 !important;
    background-color: #ffffff !important;

    .fa-chevron-down {
      font-weight: 500;
    }
  }
  
  /* Dropdown items  */

});

<!-- German translation for TrustArc cookie consent banner (DE site only) -->
<script nonce="101b26326eb3d80776383227b4b77079">
(function() {
  if (!window.location.href.includes('/de')) return;

  var idTranslations = {
    'truste-consent-text': "Wir verwenden Cookies, um Ihnen auf unserer Website die bestmögliche Erfahrung zu bieten. Außerdem verwenden wir Cookies, um sicherzustellen, dass wir Ihnen relevante Werbung anzeigen. Wenn Sie fortfahren, ohne Ihre Einstellungen zu ändern, gehen wir davon aus, dass Sie damit einverstanden sind, alle Cookies auf dieser Website zu erhalten. Sie können Ihre Cookie-Einstellungen jedoch jederzeit ändern.",
    'truste-consent-button': 'Alle akzeptieren',
    'truste-consent-required': 'Alle ablehnen',
    'truste-show-consent': 'Einstellungen verwalten'
  };

  function translateTrustArc() {
    Object.keys(idTranslations).forEach(function(id) {
      var el = document.getElementById(id);
      if (el && el.textContent.trim() !== idTranslations[id]) {
        el.textContent = idTranslations[id];
      }
    });
    // The floating "Cookie Preferences" icon/link has no stable id, so match by class + current English text
    document.querySelectorAll('.truste_cursor_pointer').forEach(function(el) {
      if (el.textContent.trim() === 'Cookie Preferences') {
        el.textContent = 'Cookie-Einstellungen';
      }
    });
  }

  // TrustArc injects (and sometimes re-injects) its DOM asynchronously, so watch
  // for it rather than relying on a single DOMContentLoaded pass.
  var observer = new MutationObserver(translateTrustArc);
  if (document.body) {
    observer.observe(document.body, { childList: true, subtree: true });
  }
  document.addEventListener('DOMContentLoaded', translateTrustArc);
  translateTrustArc();
})();
</script>

<!-- ENA-1483: APAC job applications label the name fields "Legal First Name" / "Legal Last Name (Surname)".
     The application form's own markup carries nothing about the job's location, so the
     region is read from the phone input's props: primaryIso2 is set server-side from
     @job.location.country_code (app/views/external/job_postings/applications/fieldsets/_details.html.erb),
     i.e. it IS the posting's country. That avoids a second request to the job advert.
     The text is set here rather than via a CSS ::before so the replacement keeps the exact
     type of every other label and leaves the required asterisk alone. The
     html.is-apac-application class is also set, as a hook for any future CSS. -->
<script nonce="101b26326eb3d80776383227b4b77079">
(function () {
  var APAC_COUNTRIES = [
    'AU',       /* APAC-Australia */
    'CN', 'TW', /* APAC-China-Taiwan */
    'IN',       /* APAC-India */
    'JP',       /* APAC-Japan */
    'KR',       /* APAC-Korea */
    'MY',       /* APAC-Malaysia */
    'SG',       /* APAC-Singapore */
    'TH',       /* APAC-Thailand */
    'VN'        /* APAC-Vietnam */
  ];

  var RELABEL = {
    application_form_application_first_name: 'Legal First Name',
    application_form_application_last_name: 'Legal Last Name (Surname)'
  };

  function postingCountry() {
    var el = document.querySelector(
      'script.js-react-on-rails-component[data-component-name="Shared::Form::Phonenumberinput"]'
    );
    if (!el) return null;
    try {
      var props = JSON.parse(el.textContent) || {};
      return props.primaryIso2 ? String(props.primaryIso2).toUpperCase() : null;
    } catch (e) {
      return null;
    }
  }

  function setLabelText(label, text) {
    var done = false;
    Array.prototype.forEach.call(label.childNodes, function (node) {
      if (node.nodeType === 3 && node.nodeValue.trim()) {
        node.nodeValue = done ? '' : text;
        done = true;
      }
    });
    if (!done) label.insertBefore(document.createTextNode(text), label.firstChild);
  }

  function apply() {
    var root = document.documentElement;
    root.classList.remove('is-apac-application');

    if (!document.getElementById('application-form')) return;

    var country = postingCountry();
    if (!country || APAC_COUNTRIES.indexOf(country) === -1) return;

    root.classList.add('is-apac-application');

    Object.keys(RELABEL).forEach(function (id) {
      var label = document.querySelector('label[for="' + id + '"]');
      if (label) setLabelText(label, RELABEL[id]);
    });
  }

  apply();

  /* Turbolinks swaps <body> per visit but document/window persist, so bind once. */
  if (!window.__ena1483ApacLabels) {
    window.__ena1483ApacLabels = true;
    document.addEventListener('turbolinks:load', apply);
  }
})();
</script>
