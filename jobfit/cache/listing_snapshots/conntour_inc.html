      href="/images/home-hero-poster.webp"

    <!-- Cookie consent (orestbida/cookieconsent). Tracking scripts below are
         type="text/plain" and only activated by the library once the visitor
         opts into the matching data-cookiecategory. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v2.9.2/dist/cookieconsent.css"

    <style>
      /* Theme the consent UI with the site's dark design tokens (the tokens
         live in the app bundle; the hex fallbacks mirror src/index.css). */
      #cc--main {
        --cc-font-family: "Helvetica Now Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --cc-font-size: 12px;
        --cc-bg: var(--token-card, #18191b);
        --cc-text: var(--token-text-secondary, #d2d2d2);
        --cc-border-radius: 0;
        --cc-btn-border-radius: 0;
        --cc-btn-primary-bg: var(--token-button-primary, #fbfbf5);
        --cc-btn-primary-text: var(--token-button-inverse, #07080a);
        --cc-btn-primary-hover-bg: #ffffff;
        --cc-btn-primary-hover-text: var(--token-button-inverse, #07080a);
        --cc-btn-secondary-bg: transparent;
        --cc-btn-secondary-text: var(--token-text-primary, #fbfbf5);
        --cc-btn-secondary-hover-bg: rgb(251 251 245 / 0.08);
        --cc-btn-secondary-hover-text: var(--token-text-primary, #fbfbf5);
        --cc-toggle-bg-off: var(--token-text-tertiary, #505050);
        --cc-toggle-bg-on: var(--token-visual-brand, #d83c3c);
        --cc-toggle-bg-readonly: var(--token-stroke, #2f3032);
        --cc-toggle-knob-bg: var(--token-text-primary, #fbfbf5);
        --cc-toggle-knob-icon-color: var(--token-card, #18191b);
        --cc-block-text: var(--token-text-secondary, #d2d2d2);
        --cc-cookie-category-block-bg: rgb(251 251 245 / 0.04);
        --cc-cookie-category-block-bg-hover: rgb(251 251 245 / 0.08);
        --cc-section-border: var(--token-stroke, #2f3032);
        --cc-cookie-table-border: var(--token-stroke, #2f3032);
        --cc-overlay-bg: rgb(7 8 10 / 0.7);
        --cc-webkit-scrollbar-bg: var(--token-stroke, #2f3032);
        --cc-webkit-scrollbar-bg-hover: var(--token-text-tertiary, #505050);
        --cc-consent-modal-box-shadow: 0 10px 30px rgb(0 0 0 / 0.5);
      }

      /* Headings in the display font, like the rest of the site. */
      #cc--main #c-ttl,
      #cc--main #s-ttl,
      #cc--main .b-tl {
        color: var(--token-text-primary, #fbfbf5);
      }
      #cc--main #c-ttl,
      #cc--main #s-ttl {
        font-family: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        letter-spacing: -0.01em;
      }

      /* Buttons match .site-btn: square, uppercase, Elios. */
      #cc--main .c-bn {
        border: 1px solid var(--token-stroke, #2f3032);
        font-family: "Elios", "Helvetica Now Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.85em;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        padding: 0.7em 1em;
      }
      #cc--main #c-bns button:first-child,
      #cc--main #s-bns button:first-child {
        border-color: transparent;
      }

      /* Compact consent bar. */
      #cc--main #cm.cloud {
        max-width: 34em;
        padding: 1em 1.2em;
      }
      #cc--main .cloud #c-inr-i {
        padding-right: 1.4em;
      }
      #cc--main .cloud #c-bns {
        min-width: 110px;
      }

      /* Compact settings modal on desktop (mobile keeps the library's
         full-screen layout, which these sizes would break). */
      @media screen and (min-width: 689px) {
        #cc--main #s-inr {
          height: min(30em, 85vh);
          max-width: 30em;
          top: 50%;
          translate: 0 -50%;
          padding-top: 3.2em;
          padding-bottom: 3.6em;
        }
        #cc--main #s-hdr {
          height: 3.2em;
          padding: 0 1.2em;
        }
        #cc--main #s-bns {
          height: 3.6em;
          padding: 0.7em 1.2em;
        }
        #cc--main #s-bl {
          padding: 1em 1.2em;
        }
        #cc--main #s-cnt .b-bn .b-tl {
          padding: 1em 5.4em 1em 2.4em;
        }
      }
    </style>

    <script
      defer
      src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@v2.9.2/dist/cookieconsent.js"
    ></script>
    <script>
      window.addEventListener('load', function () {
        var cc = initCookieConsent();

        cc.run({
          current_lang: 'en',
          autoclear_cookies: true,
          page_scripts: true,
          gui_options: {
            consent_modal: {
              layout: 'cloud',
              position: 'bottom center',
              transition: 'slide'
            }
          },
          languages: {
            'en': {
              consent_modal: {
                title: 'We use cookies',
                description: 'Hi, this website uses essential cookies to ensure its proper operation and tracking cookies to understand how you interact with it.',
                primary_btn: {
                  text: 'Accept all',
                  role: 'accept_all'
                },
                secondary_btn: {
                  text: 'Settings',
                  role: 'settings'
                }
              },
              settings_modal: {
                title: 'Cookie preferences',
                save_settings_btn: 'Save settings',
                accept_all_btn: 'Accept all',
                reject_all_btn: 'Reject all',
                blocks: [
                  {
                    title: 'Cookie usage',
                    description: 'I use cookies to ensure the basic functionalities of the website and to enhance your online experience.'
                  }, {
                    title: 'Analytics cookies',
                    description: 'These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site.',
                    toggle: {
                      value: 'analytics',
                      enabled: false,
                      readonly: false
                    }
                  }, {
                    title: 'Marketing cookies',
                    description: 'These cookies are used to provide you with more relevant ads.',
                    toggle: {
                      value: 'marketing',
                      enabled: false,
                      readonly: false
                    }
                  }
                ]
              }
            }
          }
        });
      });
    </script>
