      window.tws = {
        listeners: {},
        fired: {},
        on: function(name, listener) {
          if (!tws.listeners[name]) {
            tws.listeners[name] = [];
          }

          if (tws.fired.hasOwnProperty(name)) {
            listener(tws.fired[name]);
          } else {
            tws.listeners[name].push(listener);
          }
          return function() { tws.off(name, listener); }
        },
        off: function(name, listener) {
          if (tws.listeners[name]) {
            tws.listeners[name] = tws.listeners[name].filter(function(l) { return l !== listener});
          }
        },
        fire: function(name, oneOffEvent, payload) {
          if (tws.listeners[name]) {
            tws.listeners[name].forEach(function(l) { l(payload); });
          }
          if (oneOffEvent) {
            delete tws.listeners[name];
            tws.fired[name] = payload;
          }
        },
        data: { }
      };

>\n<h1 style=\"text-align: center;\">Risparmiate Soldi, Allenatevi Ogni Volta che Volete,&nbsp;in Totale Sicurezza.&nbsp;</h1>\n<p style=\"text-align: center;\"><span style=\"font-size: 12px;\">Unitevi alla famiglia&nbsp;<strong>Laser Ammo</strong>&nbsp;e provate una delle opzioni a vostra disposizione per imparare ad utilizzare al meglio la vostra arma.<br />Sviluppate e mantenete le vostre abilit&agrave; di tiro allenandovi ogni giorno dal comfort della vostra abitazione.</span></p>\n<p style=\"text-align: center;\"><span style=\"font-size: 12px;\">Scegliete tra tiro in bianco/dry fire, bersagli elettronici o simulatori.</span></p>\n<p style=\"text-align: center;\"><a href=\"/shop/ws26/40626/files/Catalog%202026%20EU%20web.pdf\"><img src=\"/shop/ws26/40626/files/PRODUCT%20CATALOG%202026.jpg\" width=\"156\" height=\"58\" caption=\"false\" /></a></p>","fr":"<p style=\"text-align: center;\"><span style=\"font-size: 18px;\"><strong>N'importe quand, n'importe o&ugrave; !</strong></span></p>\n<p style=\"text-align: center;\"><span style=\"font-size: 18px;\"><strong>Economisez de l'argent, entra&icirc;nez-vous&nbsp;plus, prot&eacute;gez-vous.&nbsp;</strong></span></p>\n<p style=\"text-align: center;\"><span style=\"font-size: 12px;\">Rejoignez la famille&nbsp;<strong>Laser Ammo</strong>, qui vous propose des&nbsp;outils pour&nbsp;aller plus loin avec votre arme &agrave; feu.<br /></span><span style=\"font-size: 12px;\">Consolidez&nbsp;vos comp&eacute;tences de tir &agrave; leur meilleur&nbsp;en vous entra&icirc;nant chaque jour dans le confort de votre domicile.</span></p>\n<p style=\"text-align: center;\"><span style=\"font-size: 12px;\">Faites simplement votre choix entre le tir &agrave; sec simple, les cibles &eacute;lectroniques ou les simulateurs et vous &ecirc;tes pr&ecirc;t.</span></p>\n<p style=\"text-align: center;\"><a href=\"/shop/ws26/40626/files/Catalog%202026%20EU%20web.pdf\"><img src=\"/shop/ws26/40626/files/PRODUCT%20CATALOG%202026.jpg\" width=\"156\" hei
