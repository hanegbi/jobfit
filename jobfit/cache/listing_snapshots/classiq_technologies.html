<script>
  // on Weglot init
Weglot.on('initialized', ()=>{
	// get the current active language
  const currentLang = Weglot.getCurrentLang();
  // call updateDropdownLinks function
  updateSW9DropdownLinks(currentLang);
});

// for each of the .wg-element-wrapper language links
document.querySelectorAll('.wg-element-wrapper.sw9 [lang]').forEach((link)=>{
		// add a click event listener
		link.addEventListener('click', function(e){
    	// prevent default
			e.preventDefault();
      // switch to the current active language      
      Weglot.switchTo(this.getAttribute('lang'));
      // call updateDropdownLinks function
      updateSW9DropdownLinks(this.getAttribute('lang'));
		});
});



// updateDropdownLinks function
function updateSW9DropdownLinks(currentLang){
	// get the wrapper element
	const $wrapper = document.querySelector('.wg-element-wrapper.sw9'); 

  // if the .w-dropdown-toggle is not the current active language
 	if($wrapper.querySelector('.w-dropdown-toggle').getAttribute('lang') !== currentLang){
  	// get the current active language link
  	const $activeLangLink = $wrapper.querySelector('[lang='+currentLang+']');
    // swap the dropdown toggle's text with the current active language link text
		const $toggle = $activeLangLink.closest('.wg-element-wrapper').querySelector('.w-dropdown-toggle');
  	const toggleTxt = $toggle.textContent; 
  	const activeLangLinkTxt = $activeLangLink.textContent;
  	$toggle.querySelector('div').textContent = activeLangLinkTxt;
  	$activeLangLink.textContent = toggleTxt;
  	// swap the dropdown toggle's lang attr with the current active language link lang attr  
  	const lang = $activeLangLink.getAttribute('lang');
		const toggleLang = $toggle.getAttribute('lang');
		$toggle.setAttribute('lang', lang);
		$activeLangLink.setAttribute('lang', toggleLang);
  }

}	
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const mainWrapper = document.querySelector('.main-wrapper');

  function getBar() {
    return document.querySelector('.announcement-bar');
  }

  function updateMargin() {
    const bar = getBar();

    if (!mainWrapper) return;

    if (
      bar &&
      getComputedStyle(bar).display !== 'none'
    ) {
      mainWrapper.style.marginTop = `${bar.offsetHeight}px`;
    } else {
      mainWrapper.style.marginTop = '0px';
    }
  }

  if (localStorage.getItem('announcementBarHidden') === 'true') {
    getBar()?.remove();
    updateMargin();
    return;
  }

  updateMargin();

  window.addEventListener('resize', updateMargin);

  const bar = getBar();

  if (bar) {
    new ResizeObserver(updateMargin).observe(bar);
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.bar-close')) return;

    localStorage.setItem('announcementBarHidden', 'true');

    setTimeout(() => {
      getBar()?.remove();
      updateMargin();
    }, 500);
  });
});
</script></body></html>
