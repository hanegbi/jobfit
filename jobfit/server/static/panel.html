<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jobfit control panel</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0b0e11; color: #e6e9ec; }
  .topnav { display: flex; gap: 4px; padding: 12px 16px; border-bottom: 1px solid #232a32; position: sticky; top: 0; background: #0b0e11; z-index: 1; }
  .topnav a { background: #171c22; border: 1px solid #232a32; color: #9aa4ad; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; text-decoration: none; }
  .topnav a:hover { color: #e6e9ec; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 20px 60px; }
  section { padding-top: 28px; margin-top: 20px; border-top: 1px solid #1a2129; }
  section:first-of-type { border-top: none; margin-top: 8px; }
  h2 { font-size: 15px; margin: 0 0 14px; color: #9aa4ad; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: #12161b; border: 1px solid #232a32; border-radius: 8px; padding: 12px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 20px; }
  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #232a32; gap: 12px; }
  .list-row .meta { color: #9aa4ad; font-size: 12px; }
  .list-row .name { flex: 1; }
  form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 480px; margin-bottom: 14px; }
  input, button { background: #171c22; border: 1px solid #232a32; color: #e6e9ec; padding: 7px 10px; border-radius: 6px; }
  input[type="text"] { flex: 1; min-width: 140px; }
  button { cursor: pointer; }
  .msg { font-size: 13px; color: #76b900; min-height: 18px; margin-bottom: 6px; }
  .msg.error { color: #ff6b6b; }
  .empty { color: #5c6a66; font-size: 13px; font-style: italic; padding: 6px 0; }
  #runLog { background: #12161b; border: 1px solid #232a32; border-radius: 8px; padding: 10px; height: 220px; overflow-y: auto; font-size: 12px; margin: 10px 0; }
  label.force { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #9aa4ad; }
</style>
</head>
<body>
  <div class="topnav">
    <a href="#dashboard">Dashboard</a>
    <a href="#profiles">CV Profiles</a>
    <a href="#connections">Connections</a>
    <a href="#referrals">Referrals</a>
    <a href="#run">Run &amp; Logs</a>
  </div>

  <main>
    <section id="dashboard">
      <h2>Dashboard</h2>
      <div class="stat-row" id="statRow"></div>
      <div id="scoreDistribution"></div>
    </section>

    <section id="profiles">
      <h2>CV Profiles</h2>
      <form id="profileForm">
        <input type="text" name="name" placeholder="Profile name" required>
        <input type="file" name="file" accept=".docx" required>
        <button type="submit">Add CV profile</button>
      </form>
      <div class="msg" id="profileMsg"></div>
      <div id="profileList"></div>
    </section>

    <section id="connections">
      <h2>Connections</h2>
      <div class="msg" id="connectionsStatus"></div>
      <form id="connectionsForm">
        <input type="file" name="file" accept=".csv" required>
        <button type="submit">Upload connections CSV</button>
      </form>
      <div class="msg" id="connectionsMsg"></div>
    </section>

    <section id="referrals">
      <h2>Referrals</h2>
      <form id="referralForm">
        <input type="file" name="file" accept=".json" required>
        <button type="submit">Upload referral export</button>
      </form>
      <div class="msg" id="referralMsg"></div>
      <div id="referralList"></div>
    </section>

    <section id="run">
      <h2>Run &amp; Logs</h2>
      <button id="runBtn">Run update</button>
      <label class="force"><input type="checkbox" id="runForce"> force (ignore recently-checked skip)</label>
      <div class="msg" id="runStatus"></div>
      <pre id="runLog"></pre>
      <div id="runHistory"></div>
    </section>
  </main>

<script>
function fmtDate(iso) {
  if (!iso) return "never";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString();
}

async function refreshDashboard() {
  const stats = await (await fetch("/api/dashboard")).json();
  document.getElementById("statRow").innerHTML = `
    <div class="stat"><b>${stats.total_jobs_open}</b>open jobs</div>
    <div class="stat"><b>${stats.total_jobs_all_time}</b>jobs all-time</div>
    <div class="stat"><b>${stats.companies}</b>companies</div>
    <div class="stat"><b>${stats.connections}</b>connections</div>
  `;
  document.getElementById("scoreDistribution").innerHTML = Object.entries(stats.score_distribution).map(([id, buckets]) => {
    const profile = stats.profiles.find(p => p.id === id);
    const rows = Object.entries(buckets).map(([bucket, count]) => `<div>${bucket}-${Number(bucket) + 9}: ${count}</div>`).join("");
    return `<h3 style="font-size:13px;margin:12px 0 4px;">${profile ? profile.name : id}</h3>${rows}`;
  }).join("") || `<div class="empty">No CV profiles yet - add one below to see score distributions.</div>`;
  document.getElementById("connectionsStatus").textContent = `Last uploaded: ${fmtDate(stats.connections_uploaded_at)}`;
  document.getElementById("connectionsStatus").classList.remove("error");
  return stats;
}

async function refreshProfiles() {
  const profiles = await (await fetch("/api/profiles")).json();
  document.getElementById("profileList").innerHTML = profiles.length ? profiles.map(p => `
    <div class="list-row">
      <span class="name">${p.name}</span>
      <span class="meta">added ${fmtDate(p.uploaded_at)}</span>
      <button data-id="${p.id}" class="delete-profile">Remove</button>
    </div>`).join("") : `<div class="empty">No CV profiles yet.</div>`;
  document.querySelectorAll(".delete-profile").forEach(btn => {
    btn.addEventListener("click", async () => {
      await fetch(`/api/profiles/${btn.dataset.id}`, { method: "DELETE" });
      await refreshProfiles();
      await refreshDashboard();
    });
  });
}

async function refreshReferrals() {
  const uploads = await (await fetch("/api/referrals")).json();
  document.getElementById("referralList").innerHTML = uploads.length ? uploads.map(u => `
    <div class="list-row">
      <span class="name">${u.filename}</span>
      <span class="meta">uploaded ${fmtDate(u.uploaded_at)}</span>
    </div>`).join("") : `<div class="empty">No referral exports uploaded yet.</div>`;
}

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("profileMsg");
  msg.textContent = "Uploading...";
  msg.classList.remove("error");
  try {
    const res = await fetch("/api/profiles", { method: "POST", body: new FormData(e.target) });
    if (!res.ok) throw new Error((await res.json()).detail || "upload failed");
    msg.textContent = "Added.";
    e.target.reset();
    await refreshProfiles();
    await refreshDashboard();
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});

document.getElementById("connectionsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("connectionsMsg");
  msg.textContent = "Uploading...";
  msg.classList.remove("error");
  try {
    const res = await fetch("/api/connections", { method: "POST", body: new FormData(e.target) });
    if (!res.ok) throw new Error((await res.json()).detail || "upload failed");
    msg.textContent = "Connections updated.";
    e.target.reset();
    await refreshDashboard();
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});

document.getElementById("referralForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("referralMsg");
  msg.textContent = "Uploading...";
  msg.classList.remove("error");
  try {
    const res = await fetch("/api/referrals", { method: "POST", body: new FormData(e.target) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "upload failed");
    msg.textContent = `${data.added_new_job} new, ${data.merged_into_existing_job} already tracked (marked as referral).`;
    e.target.reset();
    await refreshReferrals();
    await refreshDashboard();
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add("error");
  }
});

async function refreshRunStatus() {
  const s = await (await fetch("/api/run/status")).json();
  document.getElementById("runStatus").textContent = s.running ? `Running (started ${fmtDate(s.started_at)})` : "Idle";
  document.getElementById("runBtn").disabled = s.running;
  return s.running;
}

async function refreshRunHistory() {
  const history = await (await fetch("/api/run/history")).json();
  document.getElementById("runHistory").innerHTML = history.length ? history.slice().reverse().map(r => `
    <div class="list-row">
      <span class="name">${fmtDate(r.started_at)} ${r.crashed ? "(crashed)" : ""}</span>
      <span class="meta">${r.new_jobs ?? 0} new, ${r.closed_jobs ?? 0} closed, ${(r.failures || []).length} failed</span>
    </div>`).join("") : `<div class="empty">No runs yet.</div>`;
}

let runEventSource = null;
function streamRunLog() {
  if (runEventSource) runEventSource.close();
  const logEl = document.getElementById("runLog");
  runEventSource = new EventSource("/api/run/stream");
  runEventSource.onmessage = (e) => {
    logEl.textContent += e.data + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  };
  runEventSource.addEventListener("done", async () => {
    runEventSource.close();
    await refreshRunStatus();
    await refreshRunHistory();
    await refreshDashboard();
  });
}

document.getElementById("runBtn").addEventListener("click", async () => {
  const force = document.getElementById("runForce").checked;
  document.getElementById("runLog").textContent = "";
  const res = await fetch("/api/run", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ force }),
  });
  if (res.status === 409) {
    document.getElementById("runStatus").textContent = "A run is already active.";
    return;
  }
  await refreshRunStatus();
  streamRunLog();
});

refreshDashboard();
refreshProfiles();
refreshReferrals();
refreshRunStatus();
refreshRunHistory();
</script>
</body>
</html>
